<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Save Workout · Gym Log</title>
    <meta name="description" content="Review and save a workout record to Gym Log.">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./index.html" aria-label="Gym Log home">
        <span class="brand-mark">GL</span>
        <span>
          <strong>Gym Log</strong>
          <small>Save workout</small>
        </span>
      </a>
      <nav class="nav-actions" aria-label="주요 메뉴">
        <a href="./index.html">Dashboard</a>
        <a href="./body.html">InBody</a>
        <a href="./machines.html">Machines</a>
      </nav>
    </header>

    <main class="save-shell">
      <section class="save-card">
        <p class="eyebrow">Connection</p>
        <h1>저장 설정</h1>
        <p class="summary">처음 한 번만 Worker 주소와 Save key를 저장하면, 이후에는 ChatGPT가 만든 링크를 열고 버튼만 누르면 돼.</p>
        <div class="form-grid">
          <div class="field">
            <label for="workerUrl">Cloudflare Worker URL</label>
            <input id="workerUrl" placeholder="https://gym-log-api.example.workers.dev">
          </div>
          <div class="field">
            <label for="apiSecret">Save key</label>
            <input id="apiSecret" type="password" placeholder="API_SECRET">
          </div>
        </div>
        <div class="actions">
          <button class="secondary-button" id="saveSettings" type="button">설정 저장</button>
          <button class="secondary-button" id="clearSettings" type="button">지우기</button>
        </div>
        <p class="status" id="settingsStatus"></p>
      </section>

      <section class="save-card">
        <p class="eyebrow">Preview</p>
        <h2>저장할 기록</h2>
        <p class="summary">저장 전에 날짜, 운동명, 중량, 세트 수가 맞는지 한 번만 확인해줘.</p>
        <textarea id="payloadInput" spellcheck="false"></textarea>
        <div class="actions">
          <button class="secondary-button" id="formatPayload" type="button">정리</button>
          <button class="primary-button" id="saveWorkout" type="button">GitHub에 저장</button>
        </div>
        <p class="status" id="saveStatus"></p>
        <div class="preview" id="preview"></div>
      </section>
    </main>

    <script src="./save.js"></script>
  </body>
</html>
